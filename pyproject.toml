[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repairscope-wma"
version = "0.1.0"
description = "Goal-protecting structured action-effect learning on the WMA workflow"
readme = "docs/REPAIRSCOPE.md"
requires-python = ">=3.11"
dependencies = ["torch>=2.5,<2.11", "numpy>=1.26,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "build>=1,<2", "wheel>=0.44"]
appworld = ["appworld @ git+https://github.com/StonyBrookNLP/appworld.git@42b5bcf3cd334fee33f0c37c02070a9f5807add5"]

[project.scripts]
repairscope = "repairscope.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["repairscope*", "agent*"]

[tool.setuptools.package-data]
repairscope = ["fixtures/*.json", "fixtures/*.md"]
agent = ["prompts/**/*.json", "prompts/**/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests/repairscope"]
addopts = "-ra"

[tool.mypy]
explicit_package_bases = true
exclude = [
    "environment_docker"
]

[[tool.mypy.overrides]]
module = [
    "setuptools.*",
    "pytest.*",
    "pytest_asyncio.*",
    "py.*",
    "munkres.*",
    "weave.*",
    "gradio_client.*",
    "datasets.*",
    "google.*",
    "vertexai.*",
    "transformers.*"
]
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repairscope"
version = "0.2.0"
description = "Execution-grounded evolution of conditional repair knowledge"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10", "build>=1,<2"]

[project.scripts]
repairscope = "repairscope.cli:main"

[project.urls]
Repository = "https://github.com/Hang-276/RepairScope"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repairscope"
version = "0.1.0"
description = "Predicting goal-level repair effects for scoped agent recovery"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10", "build>=1,<2"]
ml = ["torch>=2.5,<3", "transformers>=4.51,<4.58", "peft>=0.15,<0.19", "accelerate>=1,<2", "pyyaml>=6,<7"]
cuda = ["bitsandbytes>=0.45,<0.49"]

[project.scripts]
repairscope = "b2_appworld.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

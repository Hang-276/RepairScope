[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repairscope"
version = "2.0.0"
description = "Goal-sufficient dynamic scope learning for long-horizon agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["torch>=2.5,<2.11", "numpy>=1.26,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "build>=1,<2", "wheel>=0.44"]
appworld = ["appworld @ git+https://github.com/StonyBrookNLP/appworld.git@42b5bcf3cd334fee33f0c37c02070a9f5807add5"]

[project.scripts]
repairscope = "repairscope.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["repairscope*"]

[tool.setuptools.package-data]
repairscope = ["fixtures/*.json", "fixtures/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests/repairscope"]
addopts = "-ra"
